<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="t d">
<title id="t">SignalShield phishing analysis</title><desc id="d">SignalShield shows a high risk score of 99 with explainable warning signs.</desc><rect width="1440" height="900" fill="#f4f1e8"/><g font-family="Arial,sans-serif"><text x="70" y="52" font-size="20" font-weight="700" fill="#17221d">▣ SignalShield</text><text x="1190" y="52" font-size="13" fill="#66736c">● Analysis ready</text><line x1="0" y1="75" x2="1440" y2="75" stroke="#d4d5ce"/><text x="720" y="138" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="2" fill="#146b4b">AI + CYBERSECURITY · FORGEHACKS 2026</text><text x="720" y="207" text-anchor="middle" font-family="Georgia,serif" font-size="62" fill="#17221d">Understand the threat.</text><text x="720" y="267" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="62" fill="#146b4b">Before you click.</text><text x="720" y="312" text-anchor="middle" font-size="15" fill="#66736c">Paste a suspicious email or text. Get a clear risk score, human-readable evidence, and safe next steps.</text>
<g transform="translate(95 370)"><rect width="610" height="480" rx="22" fill="#fffef9" stroke="#d5d9d2"/><text x="30" y="50" font-size="11" font-weight="700" fill="#146b4b">01</text><text x="64" y="52" font-family="Georgia,serif" font-size="25" fill="#17221d">Message to inspect</text><text x="30" y="105" font-size="11" font-weight="700" fill="#17221d">SENDER</text><rect x="30" y="120" width="550" height="44" rx="9" fill="#fafaf6" stroke="#d9ded7"/><text x="44" y="148" font-size="13" fill="#49544e">IT Help Desk &lt;security@campus-support-login.xyz&gt;</text><text x="30" y="195" font-size="11" font-weight="700" fill="#17221d">SUBJECT</text><rect x="30" y="210" width="550" height="44" rx="9" fill="#fafaf6" stroke="#d9ded7"/><text x="44" y="238" font-size="13" fill="#49544e">URGENT: Your student account will be disabled</text><text x="30" y="285" font-size="11" font-weight="700" fill="#17221d">MESSAGE</text><rect x="30" y="300" width="550" height="95" rx="9" fill="#fafaf6" stroke="#d9ded7"/><text x="44" y="329" font-size="13" fill="#49544e">We detected unusual activity. Verify your password immediately</text><text x="44" y="352" font-size="13" fill="#49544e">within 2 hours or your account will be disabled.</text><text x="44" y="375" font-size="13" fill="#49544e">Click https://bit.ly/campus-verify to keep access.</text><rect x="405" y="420" width="175" height="42" rx="10" fill="#17221d"/><text x="432" y="446" font-size="13" font-weight="700" fill="#fff">Analyze message  →</text></g>
<g transform="translate(725 370)"><rect width="620" height="480" rx="22" fill="#17221d"/><text x="30" y="50" font-size="11" font-weight="700" fill="#aab7b0">02</text><text x="64" y="52" font-family="Georgia,serif" font-size="25" fill="#fff">Risk analysis</text><rect x="446" y="28" width="145" height="27" rx="14" fill="#ffffff12"/><text x="465" y="46" font-size="10" fill="#c4cec8">Local explainable model</text><line x1="30" y1="76" x2="590" y2="76" stroke="#ffffff20"/><circle cx="92" cy="145" r="52" fill="none" stroke="#f06a5f" stroke-width="9"/><text x="92" y="148" text-anchor="middle" font-family="Georgia,serif" font-size="34" fill="#fff">99</text><text x="92" y="168" text-anchor="middle" font-size="9" fill="#9faaa4">/ 100</text><text x="170" y="130" font-family="Georgia,serif" font-size="34" fill="#fff">High risk</text><text x="170" y="158" font-size="12" fill="#bac4bf">Multiple social-engineering signals make this message unsafe</text><text x="170" y="178" font-size="12" fill="#bac4bf">to trust without independent verification.</text><text x="30" y="227" font-size="10" font-weight="700" letter-spacing="1.5" fill="#aab7b0">WHY IT SCORED THIS WAY</text><g font-size="12" fill="#fff"><circle cx="34" cy="262" r="4" fill="#f06a5f"/><text x="50" y="266">Requests account verification</text><line x1="30" y1="281" x2="590" y2="281" stroke="#ffffff18"/><circle cx="34" cy="302" r="4" fill="#e0a443"/><text x="50" y="306">Uses urgency or a deadline</text><line x1="30" y1="321" x2="590" y2="321" stroke="#ffffff18"/><circle cx="34" cy="342" r="4" fill="#f06a5f"/><text x="50" y="346">Asks about authentication secrets</text></g><rect x="30" y="374" width="560" height="82" rx="13" fill="#ffffff0a"/><text x="48" y="399" font-size="10" font-weight="700" letter-spacing="1.2" fill="#aab7b0">SAFEST NEXT MOVE</text><text x="48" y="424" font-size="11" fill="#d7ded9">1. Do not click links, open attachments, or reply</text><text x="48" y="445" font-size="11" fill="#d7ded9">2. Verify through a known website or phone number</text></g></g></svg>
