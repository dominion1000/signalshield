<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">SignalShield architecture</title><desc id="desc">A message moves from the browser through validation, local signal extraction, optional AI analysis, and an explainable risk report.</desc>
  <rect width="1280" height="720" fill="#f4f1e8"/><text x="80" y="85" font-family="Georgia,serif" font-size="44" fill="#17221d">How SignalShield thinks</text><text x="82" y="120" font-family="Arial,sans-serif" font-size="16" fill="#66736c">A resilient hybrid pipeline: explainable locally, context-aware with AI.</text>
  <g font-family="Arial,sans-serif">
    <g transform="translate(80 210)"><rect width="220" height="260" rx="24" fill="#fffef9" stroke="#d5d9d2"/><circle cx="44" cy="46" r="17" fill="#c8f05a"/><text x="39" y="52" font-weight="700" fill="#17221d">1</text><text x="28" y="100" font-family="Georgia,serif" font-size="25" fill="#17221d">Suspicious message</text><text x="28" y="140" font-size="14" fill="#66736c">Sender + subject + body</text><rect x="28" y="168" width="164" height="12" rx="6" fill="#e7e9e2"/><rect x="28" y="194" width="136" height="12" rx="6" fill="#e7e9e2"/><rect x="28" y="220" width="152" height="12" rx="6" fill="#e7e9e2"/></g>
    <path d="M315 340h74" stroke="#146b4b" stroke-width="3"/><path d="m379 330 12 10-12 10" fill="none" stroke="#146b4b" stroke-width="3"/>
    <g transform="translate(405 175)"><rect width="300" height="330" rx="24" fill="#17221d"/><circle cx="44" cy="46" r="17" fill="#c8f05a"/><text x="39" y="52" font-weight="700" fill="#17221d">2</text><text x="28" y="100" font-family="Georgia,serif" font-size="25" fill="#fff">Local signal engine</text><g font-size="14" fill="#c4cec8"><text x="28" y="146">✓ Urgency &amp; threats</text><text x="28" y="180">✓ Credential requests</text><text x="28" y="214">✓ Link &amp; domain risk</text><text x="28" y="248">✓ Payment pressure</text><text x="28" y="282">✓ Identity mismatch</text></g><text x="28" y="312" font-size="12" fill="#8f9c95">Always available · deterministic baseline</text></g>
    <path d="M720 340h74" stroke="#146b4b" stroke-width="3"/><path d="m784 330 12 10-12 10" fill="none" stroke="#146b4b" stroke-width="3"/>
    <g transform="translate(810 210)"><rect width="180" height="260" rx="24" fill="#e4eed4" stroke="#b9cba0"/><circle cx="44" cy="46" r="17" fill="#146b4b"/><text x="39" y="52" font-weight="700" fill="#fff">3</text><text x="28" y="100" font-family="Georgia,serif" font-size="25" fill="#17221d">AI review</text><text x="28" y="140" font-size="14" fill="#536158">Context-aware</text><text x="28" y="166" font-size="14" fill="#536158">second opinion</text><rect x="28" y="198" width="124" height="35" rx="18" fill="#fff"/><text x="47" y="220" font-size="12" fill="#146b4b">Optional layer</text></g>
    <path d="M1005 340h74" stroke="#146b4b" stroke-width="3"/><path d="m1069 330 12 10-12 10" fill="none" stroke="#146b4b" stroke-width="3"/>
    <g transform="translate(1095 210)"><rect width="135" height="260" rx="24" fill="#fffef9" stroke="#d5d9d2"/><circle cx="42" cy="46" r="17" fill="#c8f05a"/><text x="37" y="52" font-weight="700" fill="#17221d">4</text><text x="22" y="102" font-family="Georgia,serif" font-size="23" fill="#17221d">Clear result</text><text x="22" y="144" font-size="13" fill="#66736c">Risk score</text><text x="22" y="172" font-size="13" fill="#66736c">Evidence</text><text x="22" y="200" font-size="13" fill="#66736c">Safe actions</text></g>
    <rect x="405" y="548" width="825" height="78" rx="18" fill="#fffef9" stroke="#d5d9d2"/><text x="435" y="579" font-size="13" font-weight="700" fill="#146b4b">SAFETY BOUNDARY</text><text x="435" y="604" font-size="14" fill="#66736c">Input limits · message treated as untrusted data · server-side API key · automatic local fallback · no persistence</text>
  </g>
</svg>
